[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-code-doc-generator"
version = "0.3.0"
description = "A lightweight Python CLI that generates function-level documentation from static code analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "python-code-doc-generator contributors" }
]
keywords = [
  "python",
  "documentation",
  "cli",
  "static-analysis",
  "developer-tools",
  "oss"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "tomli>=2.0; python_version < '3.11'",
  "twine>=5.0"
]

[project.scripts]
python-code-doc-generator = "main:main"

[project.urls]
Homepage = "https://github.com/nyks-jpg/python-code-doc-generator"
Repository = "https://github.com/nyks-jpg/python-code-doc-generator"
Issues = "https://github.com/nyks-jpg/python-code-doc-generator/issues"

[tool.setuptools]
py-modules = ["main", "doc_providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
