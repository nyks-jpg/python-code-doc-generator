name: Python Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m py_compile main.py doc_providers.py

      - name: Run unit tests
        run: python -m pytest

      - name: Build package artifacts
        run: python -m build

      - name: Validate package artifacts
        run: python -m twine check dist/*

      - name: Check installed CLI
        run: python-code-doc-generator --version

      - name: Generate Markdown documentation
        run: python-code-doc-generator main.py --coverage --language en --strict --fail-on-empty --output generated-docs.md

      - name: Generate JSON documentation
        run: python-code-doc-generator main.py --coverage --format json --language en --strict --fail-on-empty --output generated-docs.json

      - name: Run diff-aware PR documentation analysis
        if: github.event_name == 'pull_request'
        run: python-code-doc-generator main.py --coverage --diff-base origin/${{ github.base_ref }} --language en --strict --fail-on-empty --output pr-doc-analysis.md

      - name: Validate JSON output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("generated-docs.json").read_text(encoding="utf-8"))
          assert "coverage" in payload, "JSON output must include coverage"
          assert payload["coverage"]["total_functions"] >= 1
          data = payload["functions"]
          assert data, "JSON output must include at least one function"
          required = {"file", "name", "qualified_name", "signature", "summary"}
          missing = required - set(data[0])
          assert not missing, f"Missing expected keys: {sorted(missing)}"
          PY

      - name: Upload generated documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs-python-${{ matrix.python-version }}
          if-no-files-found: ignore
          path: |
            generated-docs.md
            generated-docs.json
            pr-doc-analysis.md
            dist/*
