name: Python Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m py_compile main.py

      - name: Generate Markdown documentation
        run: python main.py main.py --language en --strict --fail-on-empty --output generated-docs.md

      - name: Generate JSON documentation
        run: python main.py main.py --format json --language en --strict --fail-on-empty --output generated-docs.json

      - name: Validate JSON output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("generated-docs.json").read_text(encoding="utf-8"))
          assert isinstance(data, list), "JSON output must be a list"
          assert data, "JSON output must include at least one function"
          required = {"file", "name", "qualified_name", "signature", "summary"}
          missing = required - set(data[0])
          assert not missing, f"Missing expected keys: {sorted(missing)}"
          PY

      - name: Upload generated documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs-python-${{ matrix.python-version }}
          path: |
            generated-docs.md
            generated-docs.json
